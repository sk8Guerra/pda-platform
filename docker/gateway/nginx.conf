# =============================================================================
# Puerta de enlace de la topologia por modulos.
#
# El cliente web consume una sola direccion (http://localhost:8080) y esta
# configuracion enruta cada prefijo al contenedor correspondiente. Cuando la
# plataforma se despliega como monolito, esta pieza no interviene: el cliente
# apunta directamente al unico contenedor de aplicacion.
# =============================================================================

upstream auth        { server auth:3001; }
upstream catalogo    { server catalogo:3002; }
upstream inscripcion { server inscripcion:3003; }
upstream pagos       { server pagos:3004; }

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location /api/auth/        { proxy_pass http://auth; }
    location /api/catalogo/    { proxy_pass http://catalogo; }
    location /api/inscripcion/ { proxy_pass http://inscripcion; }
    location /api/pagos/       { proxy_pass http://pagos; }

    # Estado agregado: cada modulo expone su propia sonda en /health.
    location /health/auth        { proxy_pass http://auth/health; }
    location /health/catalogo    { proxy_pass http://catalogo/health; }
    location /health/inscripcion { proxy_pass http://inscripcion/health; }
    location /health/pagos       { proxy_pass http://pagos/health; }

    location = /health {
        default_type application/json;
        return 200 '{"estado":"ok","componente":"gateway"}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"codigo":"NO_ENCONTRADO","mensaje":"Ruta no enrutada por la puerta de enlace"}}';
    }
}
